access:
  killer-only-seconds: 10
  public-without-killer: true

container:
  size: 27
  lifetime-seconds: 300
  default-profile: normal
  face-killer: true
  # Радиус поиска существующего сундука для объединения дропа (в блоках).
  # Если мобы умирают рядом, новый лут складывается в уже стоящий сундук,
  # предотвращая появление кучи дубликатов голограмм.
  # 0 = только в том же блоке, отрицательное число (< 0) = отключить объединение.
  merge-radius: 5.0

