    # events:
    #   spawn: []
    #   open:
    #     - BossChestOpen
    #   expire:
    #     - BossChestExpire
    #   merge: []

hologram:
  line-spacing: 0.25

# Глобальные события (используются по умолчанию для всех профилей)
